name: Bug report
description: Report a bug or unexpected behavior in vMACS.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide as much detail as possible to help reproduce and investigate the issue.

  - type: input
    id: version
    attributes:
      label: vMACS version
      description: Which version or commit are you using?
      placeholder: "1.5.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: Include the distribution and version if applicable.
      placeholder: "Arch Linux"
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal emulator
      description: Which terminal emulator are you using?
      placeholder: "Kitty, foot, GNOME Terminal, etc."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Describe what went wrong.
      placeholder: Explain the issue clearly.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the steps needed to trigger the issue.
      placeholder: |
        1. Open vMACS.
        2. Open a file.
        3. Perform an action.
        4. Observe the issue.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error messages or additional information
      description: Include relevant terminal output, logs, or screenshots. Remove sensitive information before posting.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked whether this issue has already been reported.
          required: true
        - label: I can reproduce this issue, or have provided details explaining when it occurred.
          required: true
